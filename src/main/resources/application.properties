server.port=8080
spring.application.name=tictac

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

#spring.jpa.show-sql=true

jwt.access.secret=change-me-access-secret-key-must-be-at-least-32-bytes-long
jwt.access.expiration-minutes=15
jwt.refresh.secret=change-me-refresh-secret-key-must-be-at-least-32-bytes
jwt.refresh.expiration-days=30